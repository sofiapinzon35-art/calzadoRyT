<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Ventas - Calzado RyT</title>
  <style>
    :root {
      --accent: #2b6cb0;
      --danger: #e53e3e;
      --success: #38a169;
      --warning: #dd6b20;
      --muted: #6b7280;
      --border: #e2e8f0;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f7fafc;
      color: #1a202c;
    }

    header {
      background: linear-gradient(135deg, var(--accent) 0%, #1e40af 100%);
      color: white;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    header h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    header .subtitle {
      font-size: 14px;
      opacity: 0.9;
    }

    .back-link {
      display: inline-block;
      color: white;
      text-decoration: none;
      margin-top: 12px;
      font-size: 14px;
      opacity: 0.9;
    }

    .back-link:hover {
      opacity: 1;
      text-decoration: underline;
    }

    .container {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 24px;
    }

    .card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      padding: 32px;
      margin-bottom: 32px;
      animation: fadeIn 0.5s ease-in;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .card-title {
      font-size: 20px;
      font-weight: 600;
      color: #2d3748;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    label {
      font-size: 14px;
      font-weight: 500;
      color: #4a5568;
      margin-bottom: 8px;
    }

    input, select {
      padding: 12px 14px;
      border: 2px solid var(--border);
      border-radius: 8px;
      font-size: 15px;
      transition: all 0.3s ease;
      background: #f7fafc;
      font-family: inherit;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--accent);
      background: white;
      box-shadow: 0 0 0 3px rgba(43, 108, 176, 0.1);
    }

    .info-producto {
      background: #e6fffa;
      border-left: 4px solid #38b2ac;
      padding: 12px 16px;
      border-radius: 8px;
      margin-top: 12px;
      font-size: 14px;
      color: #234e52;
      display: none;
    }

    .btn {
      padding: 14px 24px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent) 0%, #1e40af 100%);
      color: white;
      box-shadow: 0 4px 12px rgba(43, 108, 176, 0.3);
      width: 100%;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(43, 108, 176, 0.4);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    thead {
      background: #f7fafc;
    }

    th {
      text-align: left;
      padding: 14px 16px;
      font-weight: 600;
      color: #4a5568;
      border-bottom: 2px solid var(--border);
    }

    td {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }

    tbody tr {
      transition: background-color 0.2s;
    }

    tbody tr:hover {
      background: #f7fafc;
    }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }

    .badge-tienda { background: #dbeafe; color: #1e40af; }
    .badge-instagram { background: #fce7f3; color: #be185d; }
    .badge-whatsapp { background: #d1fae5; color: #065f46; }
    .badge-facebook { background: #dbeafe; color: #1e3a8a; }
    .badge-web { background: #e0e7ff; color: #3730a3; }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }

    .empty-icon {
      font-size: 64px;
      margin-bottom: 16px;
      opacity: 0.5;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .container {
        padding: 0 16px;
        margin: 24px auto;
      }

      .card {
        padding: 24px 20px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      header h1 {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>💰 Gestión de Ventas</h1>
    <div class="subtitle">Registra ventas directas desde cualquier canal</div>
    <a href="dashboard.html" class="back-link">← Volver al menú</a>
  </header>

  <div class="container">
    <!-- Formulario -->
    <div class="card">
      <h2 class="card-title">
        <span>➕</span>
        Registrar Nueva Venta
      </h2>

      <form id="formVenta">
        <div class="form-grid">
          <div class="form-group">
            <label>Nombre del cliente</label>
            <input type="text" id="cliente" placeholder="Ej: María González" required>
          </div>

          <div class="form-group">
            <label>Canal de venta</label>
            <select id="canal" required>
              <option value="">Selecciona el canal</option>
              <option value="Tienda Física" selected>🏬 Tienda Física</option>
              <option value="Instagram">📱 Instagram</option>
              <option value="WhatsApp">💬 WhatsApp</option>
              <option value="Facebook">📘 Facebook</option>
              <option value="Página Web">🌐 Página Web</option>
            </select>
          </div>

          <div class="form-group">
            <label>Producto</label>
            <select id="producto" required onchange="mostrarInfoProducto()">
              <option value="">Selecciona un producto</option>
            </select>
          </div>

          <div class="form-group">
            <label>Cantidad</label>
            <input type="number" id="cantidad" placeholder="1" min="1" required>
          </div>
        </div>

        <div id="infoProducto" class="info-producto"></div>

        <button type="button" class="btn btn-primary" onclick="registrarVenta()">
          ✓ Registrar Venta
        </button>
      </form>
    </div>

    <!-- Tabla de ventas -->
    <div class="card">
      <h2 class="card-title">
        <span>📋</span>
        Historial de Ventas
      </h2>

      <table>
        <thead>
          <tr>
            <th>Cliente</th>
            <th>Canal</th>
            <th>Productos</th>
            <th>Total</th>
            <th>Fecha</th>
          </tr>
        </thead>
        <tbody id="tablaVentas">
          <tr>
            <td colspan="5">
              <div class="empty-state">
                <div class="empty-icon">⏳</div>
                <p>Cargando ventas...</p>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const API_URL = "http://localhost:3000/api/ventas";
    const API_PRODUCTOS = "http://localhost:3000/api/productos";

    async function cargarProductos() {
      try {
        const respuesta = await fetch(API_PRODUCTOS);
        const productos = await respuesta.json();

        const select = document.getElementById("producto");
        select.innerHTML = '<option value="">Selecciona un producto</option>';

        productos.forEach(p => {
          const option = document.createElement("option");
          option.value = p.id_producto;
          option.textContent = `${p.nombre} - ${p.descripcion} (${p.talla}, ${p.color}) - Stock: ${p.cantidad}`;
          option.dataset.precio = p.precio;
          option.dataset.stock = p.cantidad;
          select.appendChild(option);
        });
      } catch (error) {
        console.error("Error:", error);
      }
    }

    function mostrarInfoProducto() {
      const select = document.getElementById("producto");
      const infoDiv = document.getElementById("infoProducto");
      
      if (select.value) {
        const option = select.options[select.selectedIndex];
        const precio = parseFloat(option.dataset.precio);
        const stock = option.dataset.stock;
        
        infoDiv.style.display = "block";
        infoDiv.innerHTML = `
          <strong>💵 Precio:</strong> $${precio.toLocaleString()} | 
          <strong>📦 Stock disponible:</strong> ${stock} unidades
        `;
        
        document.getElementById("cantidad").max = stock;
      } else {
        infoDiv.style.display = "none";
      }
    }

    async function registrarVenta() {
      const cliente = document.getElementById("cliente").value.trim();
      const canal = document.getElementById("canal").value;
      const selectProducto = document.getElementById("producto");
      const idProducto = selectProducto.value;
      const cantidad = parseInt(document.getElementById("cantidad").value);

      if (!cliente || !canal || !idProducto || !cantidad) {
        alert("⚠️ Por favor, completa todos los campos");
        return;
      }

      const option = selectProducto.options[selectProducto.selectedIndex];
      const stock = parseInt(option.dataset.stock);

      if (cantidad > stock) {
        alert(`⚠️ Stock insuficiente. Solo hay ${stock} unidades disponibles`);
        return;
      }

      try {
        const respuesta = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ 
            cliente, 
            canal,
            id_producto: idProducto, 
            cantidad 
          })
        });

        const data = await respuesta.json();

        if (!respuesta.ok) {
          alert("❌ " + (data.error || "Error al registrar la venta"));
          return;
        }

        alert(`✅ Venta registrada correctamente\nCanal: ${canal}\nStock restante: ${data.stockRestante}`);
        document.getElementById("formVenta").reset();
        document.getElementById("infoProducto").style.display = "none";
        cargarVentas();
        cargarProductos();
      } catch (error) {
        console.error("❌ Error:", error);
        alert("❌ No se pudo registrar la venta");
      }
    }

    async function cargarVentas() {
      try {
        const respuesta = await fetch(API_URL);
        const ventas = await respuesta.json();

        const tabla = document.getElementById("tablaVentas");

        if (ventas.length === 0) {
          tabla.innerHTML = `
            <tr>
              <td colspan="5">
                <div class="empty-state">
                  <div class="empty-icon">💰</div>
                  <p>No hay ventas registradas</p>
                </div>
              </td>
            </tr>
          `;
          return;
        }

        tabla.innerHTML = "";

        ventas.forEach(v => {
          const canalClass = v.canal ? `badge-${v.canal.toLowerCase().replace(' ', '-')}` : 'badge-tienda';
          const fila = `
            <tr>
              <td><strong>${v.nombre_cliente || 'Cliente #' + v.id_cliente}</strong></td>
              <td><span class="badge ${canalClass}">${v.canal || 'Tienda Física'}</span></td>
              <td>${v.productos || 'Sin productos'}</td>
              <td><strong>$${parseFloat(v.total).toLocaleString()}</strong></td>
              <td>${new Date(v.fecha_venta).toLocaleString()}</td>
            </tr>
          `;
          tabla.innerHTML += fila;
        });
      } catch (error) {
        console.error("Error:", error);
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      cargarVentas();
      cargarProductos();
    });
  </script>

</body>
</html>
