<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Usuarios - Calzado RyT</title>
  <style>
    :root {
      --accent: #2b6cb0;
      --danger: #e53e3e;
      --success: #38a169;
      --muted: #6b7280;
      --border: #e2e8f0;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f7fafc;
      color: #1a202c;
    }

    header {
      background: linear-gradient(135deg, var(--accent) 0%, #1e40af 100%);
      color: white;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    header h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    header .subtitle {
      font-size: 14px;
      opacity: 0.9;
    }

    .back-link {
      display: inline-block;
      color: white;
      text-decoration: none;
      margin-top: 12px;
      font-size: 14px;
      opacity: 0.9;
    }

    .back-link:hover {
      opacity: 1;
      text-decoration: underline;
    }

    .container {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 24px;
    }

    .card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      padding: 32px;
      margin-bottom: 32px;
      animation: fadeIn 0.5s ease-in;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .card-title {
      font-size: 20px;
      font-weight: 600;
      color: #2d3748;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    label {
      font-size: 14px;
      font-weight: 500;
      color: #4a5568;
      margin-bottom: 8px;
    }

    .required {
      color: var(--danger);
    }

    input, select {
      padding: 12px 14px;
      border: 2px solid var(--border);
      border-radius: 8px;
      font-size: 15px;
      transition: all 0.3s ease;
      background: #f7fafc;
      font-family: inherit;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--accent);
      background: white;
      box-shadow: 0 0 0 3px rgba(43, 108, 176, 0.1);
    }

    .btn {
      padding: 14px 24px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent) 0%, #1e40af 100%);
      color: white;
      box-shadow: 0 4px 12px rgba(43, 108, 176, 0.3);
      width: 100%;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(43, 108, 176, 0.4);
    }

    .btn-danger {
      background: var(--danger);
      color: white;
    }

    .btn-danger:hover {
      background: #c53030;
    }

    .btn-sm {
      padding: 6px 14px;
      font-size: 13px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    thead {
      background: #f7fafc;
    }

    th {
      text-align: left;
      padding: 14px 16px;
      font-weight: 600;
      color: #4a5568;
      border-bottom: 2px solid var(--border);
    }

    td {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }

    tbody tr {
      transition: background-color 0.2s;
    }

    tbody tr:hover {
      background: #f7fafc;
    }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }

    .badge-admin {
      background: #c3dafe;
      color: #2c5282;
    }

    .badge-vendedor {
      background: #c6f6d5;
      color: #22543d;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }

    .empty-icon {
      font-size: 64px;
      margin-bottom: 16px;
      opacity: 0.5;
    }

    .success-message, .error-message {
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
      animation: slideDown 0.3s ease-out;
    }

    .success-message {
      background: #c6f6d5;
      color: #22543d;
      border-left: 4px solid var(--success);
    }

    .error-message {
      background: #fed7d7;
      color: #742a2a;
      border-left: 4px solid var(--danger);
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Responsive */
    @media (max-width: 768px) {
      .container {
        padding: 0 16px;
        margin: 24px auto;
      }

      .card {
        padding: 24px 20px;
      }

      header h1 {
        font-size: 24px;
      }

      table {
        font-size: 13px;
      }

      th, td {
        padding: 10px 8px;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>👥 Gestión de Usuarios</h1>
    <div class="subtitle">Administra los usuarios del sistema</div>
    <a href="dashboard.html" class="back-link">← Volver al menú</a>
  </header>

  <div class="container">
    <!-- Formulario -->
    <div class="card">
      <h2 class="card-title">
        <span>➕</span>
        Registrar Nuevo Usuario
      </h2>

      <div id="successMessage" class="success-message"></div>
      <div id="errorMessage" class="error-message"></div>

      <form id="formUsuario">
        <div class="form-grid">
          <div class="form-group">
            <label>
              Nombre del usuario <span class="required">*</span>
            </label>
            <input 
              type="text" 
              id="nombre" 
              placeholder="Ej: Juan Pérez" 
              required
              autocomplete="off"
            >
          </div>

          <div class="form-group">
            <label>
              Correo electrónico <span class="required">*</span>
            </label>
            <input 
              type="email" 
              id="correo" 
              placeholder="ejemplo@correo.com" 
              required
              autocomplete="off"
            >
          </div>

          <div class="form-group">
            <label>
              Contraseña <span class="required">*</span>
            </label>
            <input 
              type="password" 
              id="contrasena" 
              placeholder="••••••••" 
              required
              autocomplete="new-password"
            >
          </div>

          <div class="form-group">
            <label>
              Rol <span class="required">*</span>
            </label>
            <select id="rol" required>
              <option value="">Seleccionar rol</option>
              <option value="Administrador">👑 Administrador</option>
              <option value="Vendedor">👤 Vendedor</option>
            </select>
          </div>
        </div>

        <button type="submit" class="btn btn-primary" id="btnSubmit">
          ✓ Registrar Usuario
        </button>
      </form>
    </div>

    <!-- Tabla de usuarios -->
    <div class="card">
      <h2 class="card-title">
        <span>📋</span>
        Lista de Usuarios Registrados
      </h2>

      <table>
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Correo</th>
            <th>Rol</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tablaUsuarios">
          <tr>
            <td colspan="4">
              <div class="empty-state">
                <div class="empty-icon">⏳</div>
                <p>Cargando usuarios...</p>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const API_URL = "http://localhost:3000/api/gestionUsuarios";
    const successMessageEl = document.getElementById("successMessage");
    const errorMessageEl = document.getElementById("errorMessage");
    const btnSubmit = document.getElementById("btnSubmit");

    function showSuccess(message) {
      successMessageEl.textContent = message;
      successMessageEl.style.display = "block";
      errorMessageEl.style.display = "none";
      
      setTimeout(() => {
        successMessageEl.style.display = "none";
      }, 5000);
    }

    function showError(message) {
      errorMessageEl.textContent = message;
      errorMessageEl.style.display = "block";
      successMessageEl.style.display = "none";
      
      setTimeout(() => {
        errorMessageEl.style.display = "none";
      }, 5000);
    }

    async function cargarUsuarios() {
      try {
        const res = await fetch(API_URL);
        const data = await res.json();

        const tabla = document.getElementById("tablaUsuarios");

        if (data.length === 0) {
          tabla.innerHTML = `
            <tr>
              <td colspan="4">
                <div class="empty-state">
                  <div class="empty-icon">👥</div>
                  <p>No hay usuarios registrados</p>
                </div>
              </td>
            </tr>
          `;
          return;
        }

        tabla.innerHTML = "";

        data.forEach(usuario => {
          const badgeClass = usuario.rol === 'Administrador' ? 'badge-admin' : 'badge-vendedor';
          tabla.innerHTML += `
            <tr>
              <td><strong>${usuario.nombre}</strong></td>
              <td>${usuario.correo}</td>
              <td><span class="badge ${badgeClass}">${usuario.rol}</span></td>
              <td>
                <button class="btn btn-danger btn-sm" onclick="eliminarUsuario(${usuario.id_usuario}, '${usuario.nombre}')">
                  🗑️ Eliminar
                </button>
              </td>
            </tr>
          `;
        });
      } catch (error) {
        console.error("Error cargando usuarios:", error);
        document.getElementById("tablaUsuarios").innerHTML = `
          <tr>
            <td colspan="4">
              <div class="empty-state">
                <div class="empty-icon">❌</div>
                <p>Error al cargar usuarios</p>
              </div>
            </td>
          </tr>
        `;
      }
    }

    document.getElementById("formUsuario").addEventListener("submit", async (e) => {
      e.preventDefault();
      await agregarUsuario();
    });

    async function agregarUsuario() {
      const nombre = document.getElementById("nombre").value.trim();
      const correo = document.getElementById("correo").value.trim();
      const contrasena = document.getElementById("contrasena").value.trim();
      const rol = document.getElementById("rol").value;

      if (!nombre || !correo || !contrasena || !rol) {
        showError("⚠️ Por favor, completa todos los campos");
        return;
      }

      // Validar email
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(correo)) {
        showError("⚠️ Ingresa un correo electrónico válido");
        return;
      }

      // Validar contraseña
      if (contrasena.length < 6) {
        showError("⚠️ La contraseña debe tener al menos 6 caracteres");
        return;
      }

      btnSubmit.textContent = "Registrando...";
      btnSubmit.disabled = true;

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ nombre, correo, contrasena, rol }),
        });

        const data = await res.json();
        
        if (res.ok) {
          showSuccess(`✅ Usuario "${nombre}" registrado correctamente`);
          document.getElementById("formUsuario").reset();
          cargarUsuarios();
        } else {
          showError(data.error || "❌ Error al agregar usuario");
        }
      } catch (error) {
        console.error("Error:", error);
        showError("❌ Error de conexión con el servidor");
      } finally {
        btnSubmit.textContent = "✓ Registrar Usuario";
        btnSubmit.disabled = false;
      }
    }

    async function eliminarUsuario(id, nombre) {
      if (!confirm(`¿Estás seguro de eliminar al usuario "${nombre}"? Esta acción no se puede deshacer.`)) return;

      try {
        const res = await fetch(`${API_URL}/${id}`, { method: "DELETE" });
        const data = await res.json();

        if (res.ok) {
          showSuccess(`🗑️ Usuario "${nombre}" eliminado correctamente`);
          cargarUsuarios();
        } else {
          showError(data.error || "❌ Error al eliminar usuario");
        }
      } catch (error) {
        console.error("Error:", error);
        showError("❌ Error al eliminar usuario");
      }
    }

    // Limpiar mensajes al escribir
    document.querySelectorAll('input, select').forEach(input => {
      input.addEventListener('input', () => {
        successMessageEl.style.display = "none";
        errorMessageEl.style.display = "none";
      });
    });

    document.addEventListener("DOMContentLoaded", cargarUsuarios);
  </script>

</body>
</html>
